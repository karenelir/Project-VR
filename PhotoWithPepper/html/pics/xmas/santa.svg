<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260">
  <!-- original cute Santa Claus -->
  <ellipse cx="120" cy="250" rx="80" ry="8" fill="#000" opacity=".18"/>
  <!-- body -->
  <path d="M48 250 C40 190 70 160 120 160 C170 160 200 190 192 250 Z" fill="#d7263d"/>
  <rect x="112" y="165" width="16" height="85" fill="#fff"/>
  <rect x="50" y="206" width="140" height="16" rx="4" fill="#2b2b2b"/>
  <rect x="106" y="202" width="28" height="24" rx="4" fill="none" stroke="#f5c451" stroke-width="5"/>
  <!-- arms + mittens -->
  <path d="M58 178 C36 190 30 214 36 228" stroke="#d7263d" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M182 178 C204 190 210 214 204 228" stroke="#d7263d" stroke-width="22" fill="none" stroke-linecap="round"/>
  <circle cx="36" cy="232" r="13" fill="#1f7a3a"/><circle cx="204" cy="232" r="13" fill="#1f7a3a"/>
  <!-- face -->
  <circle cx="120" cy="108" r="50" fill="#ffd9bd"/>
  <!-- beard -->
  <g fill="#ffffff">
    <circle cx="78" cy="122" r="20"/><circle cx="162" cy="122" r="20"/>
    <circle cx="86" cy="146" r="22"/><circle cx="154" cy="146" r="22"/>
    <circle cx="104" cy="162" r="22"/><circle cx="136" cy="162" r="22"/><circle cx="120" cy="170" r="22"/>
  </g>
  <!-- cheeks, eyes, nose, smile, moustache -->
  <circle cx="92" cy="114" r="9" fill="#ff9aa2" opacity=".75"/><circle cx="148" cy="114" r="9" fill="#ff9aa2" opacity=".75"/>
  <ellipse cx="102" cy="100" rx="6" ry="8" fill="#2b2b2b"/><ellipse cx="138" cy="100" rx="6" ry="8" fill="#2b2b2b"/>
  <circle cx="104" cy="97" r="2.2" fill="#fff"/><circle cx="140" cy="97" r="2.2" fill="#fff"/>
  <path d="M96 86 Q102 82 108 86 M132 86 Q138 82 144 86" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M110 140 Q120 150 130 140" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M120 126 C108 118 92 122 88 132 C100 136 112 134 120 128 C128 134 140 136 152 132 C148 122 132 118 120 126 Z" fill="#fff"/>
  <circle cx="120" cy="118" r="9" fill="#f08a8a"/>
  <!-- hat -->
  <path d="M68 74 C74 36 104 16 140 18 C170 20 188 36 196 58 C184 50 172 50 166 56 L172 74 Z" fill="#d7263d"/>
  <rect x="62" y="64" width="116" height="22" rx="11" fill="#fff"/>
  <circle cx="198" cy="62" r="14" fill="#fff"/>
</svg>
