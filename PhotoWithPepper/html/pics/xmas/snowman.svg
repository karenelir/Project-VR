  <circle cx="120" cy="124" r="44" fill="#ffffff" stroke="#d6e6f2" stroke-width="3"/>
  <!-- buttons -->
  <circle cx="120" cy="190" r="6" fill="#2b2b2b"/><circle cx="120" cy="212" r="6" fill="#2b2b2b"/><circle cx="120" cy="234" r="6" fill="#2b2b2b"/>
