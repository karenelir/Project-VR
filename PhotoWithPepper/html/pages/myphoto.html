<!DOCTYPE html>
<html lang="en">
<head>
    <title>Your Christmas photo with Pepper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b2418">
    <!-- Photo with Pepper: the page a PHONE opens after scanning the QR code next to the photo.
         ?p=team_<time>.jpg  (photo saved by Pepper in ../pics/photos/). Phone and Pepper must be on the same Wi-Fi.
         Self-contained on purpose: no qi.js, no tablet CSS, works on any phone browser. -->
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body {
            font-family: "Roboto", "Segoe UI", Arial, sans-serif; color: #fffaf0; text-align: center;
            background: radial-gradient(ellipse at 50% 0%, #1d5a3b 0%, #0b2418 55%, #3a0b12 100%) fixed;
            background-color: #0b2418; overflow-x: hidden;
        }
        /* string of Christmas lights */
        .lights { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 5; pointer-events: none;
                  display: flex; justify-content: space-around; border-top: 3px solid #1c3b28; }
        .lights i { display: block; width: 11px; height: 18px; margin-top: 4px; border-radius: 50%;
                    animation: glow 1.4s ease-in-out infinite alternate; }
        .lights i:nth-child(4n+1) { background: #ff3b47; box-shadow: 0 3px 12px #ff3b47; }
        .lights i:nth-child(4n+2) { background: #f5c451; box-shadow: 0 3px 12px #f5c451; animation-delay: .35s; }
        .lights i:nth-child(4n+3) { background: #3ddc84; box-shadow: 0 3px 12px #3ddc84; animation-delay: .7s; }
        .lights i:nth-child(4n)   { background: #5bc0ff; box-shadow: 0 3px 12px #5bc0ff; animation-delay: 1.05s; }
        @keyframes glow { from { opacity: .45; } to { opacity: 1; } }
        /* falling snow */
        .snow { position: fixed; top: -12px; color: #ffffff; pointer-events: none; z-index: 4;
                animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        .page { position: relative; z-index: 6; max-width: 560px; margin: 0 auto; padding: 50px 18px 120px; }
        .kicker { display: inline-block; padding: 6px 16px; border-radius: 999px; background: #c8102e;
                  font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        h1 { margin: 14px 0 4px; font-size: 32px; line-height: 1.1; font-weight: 900;
             text-shadow: 0 0 18px rgba(255,59,71,.55); }
        .sub { margin: 0 0 52px; color: #f5c451; font-size: 16px; }

        /* the photo in a candy-cane frame with a Santa hat on the corner */
        .frame { position: relative; margin: 0 6px; padding: 12px; border-radius: 18px;
                 background: repeating-linear-gradient(45deg, #c8102e 0 14px, #ffffff 14px 28px);
                 box-shadow: 0 14px 34px rgba(0,0,0,.55), 0 0 0 4px #f5c451; }
        .frame img.photo { display: block; width: 100%; border-radius: 10px; background: #0b2418; min-height: 120px; }
        .hat { position: absolute; top: -44px; left: -34px; width: 34%; max-width: 170px; transform: rotate(-24deg);
               filter: drop-shadow(0 6px 6px rgba(0,0,0,.4)); }
        .holly { position: absolute; bottom: -18px; right: -12px; width: 64px; height: 44px; }
        .missing { display: none; padding: 50px 14px; border-radius: 10px; background: #0b2418; font-size: 17px; line-height: 1.4; }
        .frame.nophoto img.photo { display: none; }
        .nophoto .missing { display: block; }

        .btn { display: block; margin: 30px auto 0; max-width: 360px; padding: 18px 20px; border-radius: 999px;
               background: linear-gradient(160deg, #2fbf5b, #1a8a3c); color: #ffffff; text-decoration: none;
               font-size: 20px; font-weight: 800; border: 3px solid #ffffff; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
        .tip { margin: 12px 0 0; font-size: 14px; color: #c9d8cf; }
        .signed { display: flex; align-items: center; justify-content: center; margin-top: 34px; }
        .signed img { width: 92px; margin-right: 12px; }
        .signed p { margin: 0; text-align: left; font-size: 17px; line-height: 1.35; }
        .signed b { color: #f5c451; font-size: 20px; }

        /* snowy ground with little trees */
        .ground { position: fixed; left: 0; right: 0; bottom: 0; height: 70px; z-index: 3; pointer-events: none;
                  background: radial-gradient(ellipse at 20% 100%, #ffffff 0 60%, transparent 61%),
                              radial-gradient(ellipse at 75% 100%, #f1f6ff 0 62%, transparent 63%); }
        .tree { position: fixed; bottom: 22px; z-index: 3; width: 0; height: 0; pointer-events: none;
                border-left: 22px solid transparent; border-right: 22px solid transparent; border-bottom: 56px solid #1a7a42; }
        .tree.t1 { left: 4%; } .tree.t2 { right: 6%; transform: scale(.75); transform-origin: bottom; }
    </style>
</head>
<body>
    <div class="lights" id="lights"></div>
    <div class="page">
        <span class="kicker">Merry Christmas</span>
        <h1>Your photo with Pepper!</h1>
        <p class="sub" id="date">Ho ho ho! Here is your festive memory</p>

        <div class="frame" id="frame">
            <img class="photo" id="photo" alt="Your Christmas photo with Pepper">
            <div class="missing">This photo is not available any more.<br>Ask Pepper to take a new one!</div>
            <img class="hat" src="../pics/xmas/hat.png" alt="">
            <svg class="holly" viewBox="0 0 64 44">
                <path d="M30 26 C18 10 4 14 2 24 C10 22 14 30 8 36 C20 38 26 32 30 26Z" fill="#1f8a4c" stroke="#0e5a2e" stroke-width="2"/>
                <path d="M34 26 C46 10 60 14 62 24 C54 22 50 30 56 36 C44 38 38 32 34 26Z" fill="#1f8a4c" stroke="#0e5a2e" stroke-width="2"/>
                <circle cx="27" cy="27" r="6" fill="#d7142a"/><circle cx="37" cy="27" r="6" fill="#d7142a"/><circle cx="32" cy="19" r="6" fill="#e52a3e"/>
            </svg>
        </div>

        <a class="btn" id="save" href="#" download>&#11015; Save my photo</a>
        <p class="tip" id="tip">iPhone: press and hold the photo, then choose "Save to Photos".</p>

        <div class="signed">
            <img src="../pics/xmas/santa.png" alt="Santa Claus">
            <p><b>Thank you!</b><br>Merry Christmas<br>from Pepper</p>
        </div>
    </div>
    <div class="ground"></div>
    <div class="tree t1"></div><div class="tree t2"></div>

    <script>
        (function () {
            // only accept a plain file name made by Pepper (team_<time>.jpg)
            var m = /[?&]p=([A-Za-z0-9_.\-]+\.jpe?g)(&|$)/.exec(window.location.search);
            var photo = document.getElementById("photo");
            var save = document.getElementById("save");
            if (m) {
                var src = "../pics/photos/" + m[1];
                photo.src = src;
                save.href = src;
                save.setAttribute("download", "Christmas-with-Pepper-" + m[1]);
                var t = /team_(\d{9,})/.exec(m[1]);
                if (t) {
                    var d = new Date(parseInt(t[1], 10) * 1000);
                    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
                    if (!isNaN(d.getTime())) { document.getElementById("date").innerHTML = "Ho ho ho! " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear(); }
                }
            }
            function missing() {
                document.getElementById("frame").className += " nophoto";
                save.style.display = "none";
                document.getElementById("tip").style.display = "none";
            }
            if (!m) { missing(); } else { photo.onerror = missing; }
            // lights + snow
            var lights = document.getElementById("lights"), i;
            for (i = 0; i < 16; i++) { lights.appendChild(document.createElement("i")); }
            for (i = 0; i < 28; i++) {
                var s = document.createElement("div");
                s.className = "snow"; s.innerHTML = "&#10052;";
                s.style.left = (Math.random() * 100) + "vw";
                s.style.fontSize = (8 + Math.random() * 14) + "px";
                s.style.opacity = 0.5 + Math.random() * 0.5;
                s.style.animationDuration = (7 + Math.random() * 9) + "s";
                s.style.animationDelay = (-Math.random() * 14) + "s";
                document.body.appendChild(s);
            }
        })();
    </script>
</body>
</html>
