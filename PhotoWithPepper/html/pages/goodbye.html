<!DOCTYPE html>
<html lang="en">
<head>
    <title>See you soon</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/uc05.css">
    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>
    <script src="../js/uc05.js"></script>
    <style>
        h1 { font-size: 6.32vw; }
        .kicker { font-size: 3.59vw; letter-spacing: 6px; padding-bottom: 1vh; border-bottom-width: 3px; margin-bottom: 3vh; }
        .wave { display: inline-block; -webkit-transform-origin: 70% 70%; transform-origin: 70% 70%;
                -webkit-animation: wave 1.8s ease-in-out infinite; animation: wave 1.8s ease-in-out infinite; }
        @-webkit-keyframes wave { 0%, 60%, 100% { -webkit-transform: rotate(0); } 15%, 45% { -webkit-transform: rotate(14deg); } 30% { -webkit-transform: rotate(-8deg); } }
        @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 15%, 45% { transform: rotate(14deg); } 30% { transform: rotate(-8deg); } }
    </style>
    <link rel="stylesheet" href="../css/xmas.css">
</head>
<!-- Photo with Pepper: goodbye screen. "Take more photos" -> event morePhotos, "Finish" -> event finishPhotos. -->
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="backdrop-shade"></div>
    <div class="stage">
        <img src="../pics/xmas/santa.png" alt="Santa Claus" style="height:36vh;margin-bottom:1vh;">
        <span class="kicker">Thanks for posing</span>
        <h1>Merry Christmas! <span class="wave">&#128075;</span></h1>
        <p class="subtitle">Enjoy your photos, and happy holidays from Pepper!</p>
        <div class="navrow">
            <button type="button" class="btn nav nav-back" onclick="uc05Choose(this, 'morePhotos', 1)"><svg class="l" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12 H5 M11 6 L5 12 L11 18"/></svg>Take more photos</button>
            <button type="button" class="btn nav nav-next" onclick="uc05Choose(this, 'finishPhotos', 1)">Finish<svg class="r" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg></button>
        </div>
    </div>
    <script type="text/javascript">
        uc05SetBackdrop("backdrop", "../pics/xmas/santa.png");
    </script>
    <script src="../js/xmas.js"></script>
</body>
</html>
