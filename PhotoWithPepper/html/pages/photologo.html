<!DOCTYPE html>
<html lang="en">
<head>
    <title>Merry Christmas from Pepper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/libs/qi/2/qi.js"></script>
    <link rel="stylesheet" href="../css/xmas.css">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: "Roboto", "Segoe UI", Arial, sans-serif; }
        body { background: radial-gradient(ellipse at 50% 40%, #12402a 0%, #0b2418 60%, #3a0b12 100%) !important; }
        /* Shown on Pepper's chest while it holds a pose: a picture that matches the pose, so it appears in the photos */
        .wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 41;
                display: flex; flex-direction: row; align-items: center; justify-content: center; }
        .pic { height: 74vh; -webkit-animation: bob 2.4s ease-in-out infinite; animation: bob 2.4s ease-in-out infinite; }
        @-webkit-keyframes bob { 0%, 100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(-1.5vh); } }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5vh); } }
        .text { margin-left: 3vw; text-align: left; }
        .big { font-size: 8vw; font-weight: 900; line-height: 1.05; color: #fffaf0; text-shadow: 0 0 2.5vw rgba(255,59,71,0.55); }
        .sub { margin-top: 2vh; font-size: 3vw; color: #f5c451; letter-spacing: 0.4vw; text-transform: uppercase; }
    </style>
</head>
<!-- Photo with Pepper: shown while Pepper holds a pose. ?pose=champion|superstar|cool|hug -->
<body>
    <div class="wrap">
        <img class="pic" id="pic" src="../pics/xmas/santa.png" alt="">
        <div class="text">
            <div class="big" id="big">Ho ho ho!</div>
            <div class="sub" id="sub">Merry Christmas from Pepper</div>
        </div>
    </div>
    <script type="text/javascript">
        var match = /[?&]pose=([^&]*)/.exec(window.location.href);
        var pose = match ? match[1] : "";
        var looks = {
            champion:  ["santa",    "Ho ho ho!",              "The Santa pose"],
            superstar: ["reindeer", "Reindeer<br>pose!",      "Look at those antlers"],
            cool:      ["snowman",  "Brrr!<br>Snowman!",      "Freeze like a snowman"],
            hug:       ["tree",     "Christmas<br>hug!",      "Squeeze in, everyone"]
        };
        if (looks[pose]) {
            document.getElementById("pic").src = "../pics/xmas/" + looks[pose][0] + ".png";
            document.getElementById("big").innerHTML = looks[pose][1];
            document.getElementById("sub").innerHTML = looks[pose][2];
        }
    </script>
    <script src="../js/xmas.js"></script>
</body>
</html>
