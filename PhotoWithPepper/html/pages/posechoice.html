<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pick Pepper's pose</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/uc05.css">
    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>
    <script src="../js/uc05.js"></script>
    <style>
        .poses { display: flex; flex-direction: row; justify-content: center; margin-bottom: 3vh; }
        .pose { width: 22vw; margin: 0 0.7vw; padding: 4.5vh 1vw; text-transform: none; letter-spacing: 0.5px; font-size: 3.12vw; }
        .poseimg { display: block; width: 11vw; height: 12vw; margin: 0 auto 1vh auto; }
        .pose svg { display: block; width: 7.8vw; height: 7.8vw; margin: 0 auto 1.6vh auto; stroke: #6ee7ff; }
        /* no animations on this page: only the options */
        .btn, .btn:active { -webkit-transition: none; transition: none; -webkit-transform: none; transform: none; }
    </style>
    <link rel="stylesheet" href="../css/xmas.css">
</head>
<!-- UC05 step 4 (pose option): the group chooses Pepper's pose.
     Tap a pose -> event poseChosen (value = champion | superstar | cool | hug)
     "We're done" / "Skip" -> event poseDone. Handled by the "Strike a Pose (step 4)" box.
     ?again=1 is used after the first pose ("Another pose?"). -->
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="backdrop-shade"></div>
    <div class="stage">
        <span class="kicker">Pose with Pepper</span>
        <h1 id="title">Pick Pepper's Christmas pose</h1>
        <p class="subtitle" id="sub">Pepper strikes it, you take the photo with your phones.</p>
        <div class="poses">
            <button type="button" class="btn pose" onclick="uc05Choose(this, 'poseChosen', 'champion')">
                <img class="poseimg" src="../pics/xmas/santa.png" alt="">
                
                The Santa</button>
            <button type="button" class="btn pose" onclick="uc05Choose(this, 'poseChosen', 'superstar')">
                <img class="poseimg" src="../pics/xmas/reindeer.png" alt="">
                
                The Reindeer</button>
            <button type="button" class="btn pose" onclick="uc05Choose(this, 'poseChosen', 'cool')">
                <img class="poseimg" src="../pics/xmas/snowman.png" alt="">
                
                The Snowman</button>
            <button type="button" class="btn pose" onclick="uc05Choose(this, 'poseChosen', 'hug')">
                <img class="poseimg" src="../pics/xmas/tree.png" alt="">
                
                The Christmas Hug</button>
        </div>
        <div class="navrow">
            <button type="button" class="btn nav nav-back" onclick="uc05Choose(this, 'poseBack', 1)"><svg class="l" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12 H5 M11 6 L5 12 L11 18"/></svg>Back to photo options</button>
            <button type="button" class="btn nav nav-next" onclick="uc05Choose(this, 'poseDone', 1)">Finish<svg class="r" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg></button>
        </div>
    </div>
    <script type="text/javascript">
        uc05SetBackdrop("backdrop", "../pics/xmas/santa.png");
        if (uc05Param("again", "") === "1") {
            document.getElementById("title").innerHTML = "Another pose?";
            document.getElementById("sub").innerHTML = "Pick one more, go back to the photo options, or finish.";
        }
    </script>
    <script src="../js/xmas.js"></script>
</body>
</html>
