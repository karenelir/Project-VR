<!DOCTYPE html>
<html lang="en">
<head>
    <title>Christmas photo?</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/uc05.css">
    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>
    <script src="../js/uc05.js"></script>
    <style>
        /* Sized only in vw with fixed widths so it fits Pepper's real tablet (98vw total, never wider) */
        .stage { flex-direction: row; align-items: center; justify-content: center; padding: 6vh 1vw !important; box-sizing: border-box; width: 100vw; }
        .santa { width: 27vw; height: auto; margin-right: 2vw; -webkit-flex: none; flex: none; -webkit-animation: bob 2.4s ease-in-out infinite; animation: bob 2.4s ease-in-out infinite; }
        @-webkit-keyframes bob { 0%, 100% { -webkit-transform: translateY(0) rotate(-2deg); } 50% { -webkit-transform: translateY(-1.5vh) rotate(2deg); } }
        @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-1.5vh) rotate(2deg); } }
        .side { width: 64vw; -webkit-flex: none; flex: none; text-align: center; }
        .side h1 { font-size: 5.6vw !important; margin-bottom: 0.5vh; }
        .side .subtitle { font-size: 2.6vw !important; margin-bottom: 3vh; }
        .big { display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; -webkit-justify-content: center; justify-content: center; width: 64vw; }
        /* GIANT buttons for kids */
        .btn.answer {
            -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-flex: none; flex: none;
            width: 30vw !important; min-width: 0 !important; max-width: 30vw !important; height: 42vh; margin: 0 1vw !important; border-radius: 3vw;
            display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
            -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
            font-size: 8vw !important; font-weight: 900; letter-spacing: 0.3vw; text-transform: uppercase;
            -webkit-clip-path: none !important; clip-path: none !important; padding: 0 !important;
            border: 0.6vw solid #ffffff !important;
            -webkit-box-shadow: 0 1.2vh 0 rgba(0,0,0,0.35), 0 0 3vw rgba(255,255,255,0.25); box-shadow: 0 1.2vh 0 rgba(0,0,0,0.35), 0 0 3vw rgba(255,255,255,0.25);
        }
        .btn.answer svg { width: 10vw; height: 10vw; margin-bottom: 0.5vh; }
        .answer:active { -webkit-transform: translateY(1vh); transform: translateY(1vh); }
        #yes { background: linear-gradient(160deg, #2fbf5b, #1a8a3c) !important; color: #ffffff !important; }
        #no  { background: linear-gradient(160deg, #e3343f, #a3121f) !important; color: #ffffff !important; }
        body.locked .answer.fade { opacity: .35; }
    </style>
    <link rel="stylesheet" href="../css/xmas.css">
</head>
<!-- Photo with Pepper: "Christmas photo?" with GIANT buttons for kids.
     YES -> event yesAnswer, NO -> event noAnswer (handled by the "Ask: Christmas photo?" box). -->
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="backdrop-shade"></div>
    <div class="stage">
        <img class="santa" src="../pics/xmas/santa.png" alt="Santa Claus">
        <div class="side">
            <span class="kicker">Merry Christmas</span>
            <h1>Christmas photo?</h1>
            <p class="subtitle">Tap a big button, or tell Pepper!</p>
            <div class="big">
                <button type="button" id="yes" class="btn answer" onclick="uc05Choose(this, 'yesAnswer', 1)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L9.5 18 L20 6"/></svg>Yes</button>
                <button type="button" id="no" class="btn answer" onclick="uc05Choose(this, 'noAnswer', 1)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>No</button>
            </div>
        </div>
    </div>
    <script src="../js/xmas.js"></script>
</body>
</html>
