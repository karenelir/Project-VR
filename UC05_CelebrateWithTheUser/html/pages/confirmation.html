<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interact with Pepper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>
    <script src="../js/displayinfo.js"></script>

    <!-- Written for Pepper's older tablet browser: flexbox only (no CSS grid, no CSS variables, no "gap"),
         no backdrop-filter (unsupported there) - the blur is baked onto the background image layer instead. -->
    <style>
        * { -webkit-box-sizing: border-box; box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            background: #0a0b12;
            color: #f4f1ff;
            font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none; user-select: none;
            position: relative;
        }

        /* Full-bleed backdrop: the game art itself, blurred and darkened. */
        .backdrop {
            position: absolute;
            top: -4%; left: -4%; right: -4%; bottom: -4%;
            background-position: center;
            background-size: cover;
            -webkit-filter: blur(14px) brightness(0.45) saturate(1.2);
            filter: blur(14px) brightness(0.45) saturate(1.2);
        }
        .backdrop-shade {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(115deg, rgba(10,11,18,0.94) 0%, rgba(10,11,18,0.75) 42%, rgba(10,11,18,0.55) 100%);
        }

        /* Center stage */
        .stage {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 0 6vw;
        }

        .thumb {
            flex: 0 0 30vw;
            height: 60vh;
            border-radius: 1.2vw;
            background-position: center;
            background-size: cover;
            position: relative;
            -webkit-clip-path: polygon(2.5vw 0, 100% 0, 100% calc(100% - 2.5vw), calc(100% - 2.5vw) 100%, 0 100%, 0 2.5vw);
            clip-path: polygon(2.5vw 0, 100% 0, 100% calc(100% - 2.5vw), calc(100% - 2.5vw) 100%, 0 100%, 0 2.5vw);
            box-shadow: 0 0 0 2px rgba(110, 231, 255, 0.55), 0 1.5vw 3vw rgba(0,0,0,0.5);
        }
        /* farcry.png / outbreak.png have a baked-in "Trending" badge on their right side: shift the
           crop left to hide it (same trick gamelist.html uses via object-position). */
        .thumb.shift-left, .backdrop.shift-left { background-position: 25% center; }

        .thumb-glow {
            position: absolute;
            top: -1.5vw; left: -1.5vw; right: -1.5vw; bottom: -1.5vw;
            border-radius: 1.6vw;
            background: radial-gradient(closest-side, rgba(110, 231, 255, 0.35), transparent 70%);
            z-index: -1;
        }

        .panel { flex: 1 1 auto; padding-left: 4.5vw; min-width: 0; }

        .kicker {
            display: inline-block;
            font-size: 2.09vw;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #6ee7ff;
            padding: 0.5vh 0;
            border-bottom: 2px solid rgba(110, 231, 255, 0.5);
            margin-bottom: 2vh;
        }

        h1 {
            font-size: 4.97vw;
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 0 0 1.6vh 0;
            text-shadow: 0 0.3vw 1.5vw rgba(0,0,0,0.5);
        }
        p#pageText {
            font-size: 3vw;
            line-height: 1.4;
            color: #c3c7de;
            margin: 0 0 4.5vh 0;
            max-width: 40vw;
        }

        .buttons { display: flex; flex-direction: row; align-items: center; }

        button {
            -webkit-appearance: none;
            border: 0;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            font-size: 3.09vw;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 2.1vh 3vw;
            display: flex;
            align-items: center;
            -webkit-clip-path: polygon(1.1vw 0, 100% 0, 100% calc(100% - 1.1vw), calc(100% - 1.1vw) 100%, 0 100%, 0 1.1vw);
            clip-path: polygon(1.1vw 0, 100% 0, 100% calc(100% - 1.1vw), calc(100% - 1.1vw) 100%, 0 100%, 0 1.1vw);
            -webkit-transition: -webkit-transform .12s ease;
            transition: transform .12s ease;
        }
        button:active { -webkit-transform: scale(0.93); transform: scale(0.93); }
        button svg { width: 1.7vw; height: 1.7vw; margin-right: 0.9vw; flex: 0 0 auto; }

        #noButton {
            background: transparent;
            color: #e3a6a6;
            border: 2px solid rgba(255, 120, 120, 0.55);
            margin-right: 1.6vw;
        }
        #noButton svg { stroke: #e3a6a6; }

        #yesButton {
            background: linear-gradient(135deg, #39e2c6, #1f9ad6);
            color: #06151a;
            box-shadow: 0 0 0 rgba(57, 226, 198, 0.55);
            -webkit-animation: pulse 2.2s ease-in-out infinite;
            animation: pulse 2.2s ease-in-out infinite;
        }
        #yesButton svg { stroke: #06151a; }

        @-webkit-keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(57, 226, 198, 0.45); }
            50% { box-shadow: 0 0 2.5vw 0.3vw rgba(57, 226, 198, 0.35); }
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(57, 226, 198, 0.45); }
            50% { box-shadow: 0 0 2.5vw 0.3vw rgba(57, 226, 198, 0.35); }
        }
    </style>
</head>

<body>
    <div class="backdrop" id="backdropImg"></div>
    <div class="backdrop-shade"></div>

    <div class="stage">
        <div class="thumb" id="thumbImg">
            <div class="thumb-glow"></div>
        </div>
        <!-- kept for compatibility with displayPageInformation(), never shown -->
        <img id="pageImage" src="../pics/pepper-standing.png" alt="" style="display:none;">

        <div class="panel">
            <span class="kicker" id="kicker">Confirm</span>
            <h1 id="pageHeading"></h1>
            <p id="pageText"></p>
            <div class="buttons">
                <button type="button" id="noButton" onclick="raiseConfirmationEvent('noAnswer')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M5 5 L19 19 M19 5 L5 19"/></svg>
                    No
                </button>
                <button type="button" id="yesButton" onclick="raiseConfirmationEvent('yesAnswer')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 L10 18 L20 6"/></svg>
                    Yes
                </button>
            </div>
        </div>
    </div>
    <script>
        // Tell Pepper this page is on the screen (event pageReady), so it starts talking only now.
        window.addEventListener("load", function () {
            try {
                if (!window.QiSession) { return; }
                QiSession(function (session) {
                    session.service("ALMemory").then(function (mem) { mem.raiseEvent("pageReady", "confirmation.html"); });
                }, function () {});
            } catch (e) {}
        });
    </script>
</body>
<script type="text/javascript">
    displayPageInformation();
    // UC05: optional "kicker" URL parameter (defaults to "Confirm")
    var kicker = getUrlParam("kicker", "");
    if (kicker) { document.getElementById("kicker").innerHTML = decodeURIComponent(kicker); }
    var src = document.getElementById("pageImage").getAttribute("src");
    document.getElementById("backdropImg").style.backgroundImage = "url('" + src + "')";
    document.getElementById("thumbImg").style.backgroundImage = "url('" + src + "')";
    if (src.indexOf("farcry.png") > -1 || src.indexOf("outbreak.png") > -1) {
        document.getElementById("backdropImg").className = "backdrop shift-left";
        document.getElementById("thumbImg").className = "thumb shift-left";
    }
</script>
</html>
