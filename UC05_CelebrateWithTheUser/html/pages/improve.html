<!DOCTYPE html>
<html lang="en">
<head>
    <title>Help us improve</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/uc05.css">
    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>
    <script src="../js/uc05.js"></script>
    <style>
        .ideas { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: 86vw; margin-bottom: 2vh; }
        .idea { width: 27vw; margin: 0 0.8vw 2vh 0.8vw; padding: 3.5vh 1.5vw; font-size: 2.73vw; text-transform: none; letter-spacing: 0.5px; }
        .idea svg { display: block; width: 4.6vw; height: 4.6vw; margin: 0 auto 1.4vh auto; stroke: #6ee7ff; }
    </style>
</head>
<!-- UC05 extension 6b: after a low rating, one short, non-defensive follow-up.
     Tap -> event improvementGiven (value = the idea), "Skip" -> improvementSkipped. Speech handled by rating_d. -->
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="backdrop-shade"></div>
    <div class="stage">
        <span class="kicker">Help us improve</span>
        <h1>What could we do better?</h1>
        <p class="subtitle">Thank you for being honest. Pick one idea, or tell Pepper.</p>
        <div class="ideas">
            <button type="button" class="btn idea" onclick="uc05Choose(this, 'improvementGiven', 'wait_time')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 V12 L15.5 14"/></svg>Shorter waiting time</button>
            <button type="button" class="btn idea" onclick="uc05Choose(this, 'improvementGiven', 'game_choice')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="4"/><path d="M8 10 V14 M6 12 H10"/><circle cx="16" cy="11" r="0.6"/><circle cx="17" cy="13.5" r="0.6"/></svg>The game itself</button>
            <button type="button" class="btn idea" onclick="uc05Choose(this, 'improvementGiven', 'equipment_comfort')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 H21 V15 H15 L13 13 H11 L9 15 H3 Z"/></svg>Headset &amp; comfort</button>
            <button type="button" class="btn idea" onclick="uc05Choose(this, 'improvementGiven', 'staff_help')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20 C5 15 8 13 12 13 C16 13 19 15 19 20"/></svg>Staff &amp; instructions</button>
            <button type="button" class="btn idea" onclick="uc05Choose(this, 'improvementGiven', 'price')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 L12 4 H20 V12 L12 20 Z"/><circle cx="16" cy="8" r="1.2"/></svg>Price</button>
            <button type="button" class="btn idea" onclick="uc05Choose(this, 'improvementGiven', 'other')">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>Something else</button>
        </div>
        <div class="navrow">
            <button type="button" class="btn nav nav-back" onclick="uc05Choose(this, 'improvementSkipped', 1)">No thanks, everything was fine<svg class="r" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg></button>
        </div>
    </div>
    <script type="text/javascript">
        uc05SetBackdrop("backdrop", "../pics/zerovr.png");
    </script>
</body>
</html>
