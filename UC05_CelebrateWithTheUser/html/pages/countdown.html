<!DOCTYPE html>
<html lang="en">
<head>
    <title>Team photo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/uc05.css">
    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/uc05.js"></script>
    <style>
        #num { font-size: 26vw; font-weight: 800; line-height: 1; color: #6ee7ff;
               text-shadow: 0 0 4vw rgba(110,231,255,0.5); min-height: 22vw; }
        #flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #ffffff; opacity: 0;
                 pointer-events: none; -webkit-transition: opacity .5s ease-out; transition: opacity .5s ease-out; }
        .tick { -webkit-animation: tick .9s ease-out both; animation: tick .9s ease-out both; }
        @-webkit-keyframes tick { 0% { -webkit-transform: scale(1.5); opacity: 0; } 30% { opacity: 1; } 100% { -webkit-transform: scale(1); opacity: 1; } }
        @keyframes tick { 0% { transform: scale(1.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<!-- UC05 step 4: the group poses. The "Take Team Photo" box raises the ALMemory event
     photoCountdown with 3, 2, 1 and then 0 (= shutter), so this page stays in sync with Pepper's voice. -->
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="backdrop-shade"></div>
    <div class="stage">
        <span class="kicker">Team photo</span>
        <h1 id="title">Squeeze in, everyone!</h1>
        <p class="subtitle" id="sub">Look at Pepper's eyes, the camera is right there.</p>
        <div id="num"></div>
    </div>
    <div id="flash"></div>
    <script type="text/javascript">
        uc05SetBackdrop("backdrop", "../pics/zerovr.png");

        function show(n) {
            var el = document.getElementById("num");
            n = parseInt(n, 10);
            if (n > 0) {
                el.className = "";
                el.innerHTML = n;
                void el.offsetWidth;          // restart the CSS animation
                el.className = "tick";
            } else {
                el.innerHTML = "";
                document.getElementById("title").innerHTML = "Smile!";
                document.getElementById("sub").innerHTML = "";
                var f = document.getElementById("flash");
                f.style.opacity = 1;
                setTimeout(function () { f.style.opacity = 0; }, 120);
            }
        }

        QiSession(function (session) {
            session.service("ALMemory").then(function (mem) {
                mem.subscriber("photoCountdown").then(function (sub) {
                    sub.signal.connect(show);
                });
            }, function (error) { console.log("ALMemory error: " + error); });
        }, function () { console.log("disconnected"); });
    </script>
</body>
</html>
