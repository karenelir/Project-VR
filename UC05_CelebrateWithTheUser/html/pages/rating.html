<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rate your experience</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/uc05.css">
    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>
    <script src="../js/uc05.js"></script>
    <style>
        .scale { display: flex; flex-direction: row; justify-content: center; margin-bottom: 1.6vh; }
        .rate {
            width: 7.4vw; height: 7.4vw; margin: 0 0.6vw; padding: 0;
            font-size: 3vw; letter-spacing: 0; text-transform: none;
            display: flex; align-items: center; justify-content: center;
        }
        /* one calm colour ramp: no "red = bad" shaming for low numbers */
        .r1, .r2  { background: rgba(110,231,255,0.07); }
        .r3, .r4  { background: rgba(110,231,255,0.11); }
        .r5, .r6  { background: rgba(110,231,255,0.16); }
        .r7, .r8  { background: rgba(57,226,198,0.22); }
        .r9, .r10 { background: rgba(57,226,198,0.32); }
        .rate.chosen { background: linear-gradient(135deg, #39e2c6, #1f9ad6); color: #06151a; }
        .ends { width: 46vw; display: flex; flex-direction: row; justify-content: space-between;
                font-size: 1.3vw; color: #8f95b2; margin-bottom: 4vh; }
    </style>
</head>
<!-- UC05 step 5: rating from 1 to 10 (speech is the alternative, handled by rating_d).
     1-4 -> event ratingLow, 5-6 -> ratingOk, 7-10 -> ratingHigh (value = the number).
     "No thanks" -> event ratingDeclined (extension 5a). -->
<body>
    <div class="backdrop" id="backdrop"></div>
    <div class="backdrop-shade"></div>
    <div class="stage">
        <span class="kicker">Your opinion</span>
        <h1>How was your experience?</h1>
        <p class="subtitle">Tap a number from 1 to 10, or just say it to Pepper.</p>
        <div class="scale" id="row1"></div>
        <div class="scale" id="row2"></div>
        <div class="ends"><span>1 &middot; Not great</span><span>10 &middot; Amazing</span></div>
        <button type="button" class="btn ghost" onclick="uc05Choose(this, 'ratingDeclined', 1)">No thanks</button>
    </div>
    <script type="text/javascript">
        uc05SetBackdrop("backdrop", "../pics/zerovr.png");
        function eventFor(n) { return n <= 4 ? "ratingLow" : (n <= 6 ? "ratingOk" : "ratingHigh"); }
        function makeButton(n) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "btn rate r" + n;
            b.innerHTML = n;
            b.onclick = function () { uc05Choose(b, eventFor(n), n); };
            return b;
        }
        for (var n = 1; n <= 10; n++) {
            document.getElementById(n <= 5 ? "row1" : "row2").appendChild(makeButton(n));
        }
    </script>
</body>
</html>
