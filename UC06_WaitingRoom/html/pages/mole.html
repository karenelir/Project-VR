<!DOCTYPE html>
<html lang="en">
<head>
    <title>Whack-a-Mole</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>

    <link rel="stylesheet" type="text/css" href="../css/mole.css">
</head>
<body>
    <button type="button" id="menuButton" onclick="raiseConfirmationEvent('backToGames')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 4 L21 11 M5 10 V20 H19 V10"/></svg>
    </button>

    <div class="screen on" id="levelScreen">
        <h1>Whack-a-Mole</h1>
        <p class="sub">Pick a difficulty.</p>
        <div class="choices">
            <button type="button" class="choice c-easy" id="easyChoice" onclick="chooseLevel('easy')">
                <div class="big">Easy</div>
                <span class="tag">3 x 3 board</span>
                <div class="desc">Nine holes. A nice, steady pace.</div>
            </button>
            <button type="button" class="choice c-hard" id="hardChoice" onclick="chooseLevel('hard')">
                <div class="big">Hard</div>
                <span class="tag">5 x 5 board</span>
                <div class="desc">Twenty-five holes, and the moles are faster.</div>
            </button>
        </div>
    </div>

    <div class="screen" id="gameScreen">
        <header>
            <h1>Whack-a-Mole</h1>
            <div class="stats">
                <span class="level" id="levelTag"></span>
                <span class="score">Score <span id="scoreVal">0</span></span>
                <span class="time">Time <span id="timeVal">30</span>s</span>
            </div>
        </header>

        <div class="stage">
            <div id="grid"></div>

            <div class="final" id="finalScreen">
                <h2>Time's Up!</h2>
                <p id="finalSub">You whacked 0 moles.</p>
                <div class="endButtons">
                    <button type="button" id="changeLevelButton" onclick="showScreen('levelScreen')">Change Level</button>
                    <button type="button" id="playAgainButton" onclick="startGame()">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/mole.js"></script>
</body>
</html>
