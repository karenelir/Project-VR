<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rock Paper Scissors</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>

    <link rel="stylesheet" type="text/css" href="../css/rps.css">
</head>
<body>
    <button type="button" id="menuButton" onclick="raiseConfirmationEvent('backToGames')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 4 L21 11 M5 10 V20 H19 V10"/></svg>
    </button>

    <header>
        <h1>Rock Paper Scissors</h1>
        <div class="scoreboard">
            <span class="you">You <span id="youScore">0</span></span>
            <span class="sep">—</span>
            <span class="pep">Pepper <span id="pepScore">0</span></span>
        </div>
    </header>

    <div class="stage">
        <div id="playArea">
            <div class="reveal">
                <div class="side">
                    <div class="label">You</div>
                    <div class="box" id="youBox"><svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></svg></div>
                </div>
                <div class="vs">VS</div>
                <div class="side">
                    <div class="label">Pepper</div>
                    <div class="box" id="pepBox"><svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></svg></div>
                </div>
            </div>
            <div class="result-text" id="resultText"></div>
            <div class="choices">
                <button type="button" class="choice" id="rockChoice" onclick="play('rock')">
                    <svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="28"/></svg>
                </button>
                <button type="button" class="choice" id="paperChoice" onclick="play('paper')">
                    <svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="22" width="40" height="56" rx="6"/></svg>
                </button>
                <button type="button" class="choice" id="scissorsChoice" onclick="play('scissors')">
                    <svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="35" cy="68" r="10"/><circle cx="65" cy="68" r="10"/><path d="M25 22 L75 72 M75 22 L25 72"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="final" id="finalScreen">
            <h2 id="finalTitle">You Win!</h2>
            <p id="finalSub">2 rounds to 1.</p>
            <button type="button" id="playAgainButton" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script src="../js/rps.js"></script>
</body>
</html>
