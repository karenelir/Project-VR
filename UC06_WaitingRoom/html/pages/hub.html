<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pepper's Game Room</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>

    <!-- Flexbox only (no grid/variables/gap) for Pepper's older tablet browser; sizes in vw/vh. -->
    <link rel="stylesheet" type="text/css" href="../css/hub.css">
</head>
<body>
    <header>
        <img src="../pics/zerovr.png" alt="Zero Latency VR">
        <span class="text">
            <span class="kicker">While You Wait</span>
            <h1>Hi, I'm Pepper!</h1>
            <p>What would you like to do?</p>
        </span>
    </header>

    <div class="options">
        <button type="button" class="option play" id="playButton" onclick="raiseConfirmationEvent('playSelected')">
            <span class="icon">
                <svg viewBox="0 0 100 100" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M28 34 H72 C84 34 90 46 90 60 C90 72 84 78 77 78 C70 78 66 70 60 66 H40 C34 70 30 78 23 78 C16 78 10 72 10 60 C10 46 16 34 28 34 Z"/>
                    <path d="M28 48 V60 M22 54 H34"/>
                    <circle cx="68" cy="50" r="2.5" fill="currentColor" stroke="none"/>
                    <circle cx="74" cy="58" r="2.5" fill="currentColor" stroke="none"/>
                </svg>
            </span>
            <span class="label">
                <div class="name">Play a Game</div>
                <div class="desc">Four quick mini games.</div>
            </span>
        </button>

        <button type="button" class="option photo" id="photoButton" onclick="raiseConfirmationEvent('photoSelected')">
            <span class="icon">
                <svg viewBox="0 0 100 100" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 34 H30 L36 24 H64 L70 34 H86 V78 H14 Z"/>
                    <circle cx="50" cy="55" r="14"/>
                </svg>
            </span>
            <span class="label">
                <div class="name">Take a Photo</div>
                <div class="desc">Snap a picture with Pepper.</div>
            </span>
        </button>
    </div>

    <footer>Tap an option, or just tell me.</footer>
</body>
</html>
