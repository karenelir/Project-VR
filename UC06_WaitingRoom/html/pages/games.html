<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pepper's Game Room</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>

    <!-- Written for Pepper's older tablet browser: flexbox only (no CSS grid, no CSS variables, no "gap"),
         every size relative (vw/vh) so it scales to whatever screen size the tablet reports.
         Same visual language as UC02's gamelist.html / confirmation.html (dark, bold, chamfered accents). -->
    <link rel="stylesheet" type="text/css" href="../css/games.css">
</head>
<body>
    <header>
        <button type="button" id="menuButton" onclick="raiseConfirmationEvent('backToHub')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 4 L21 11 M5 10 V20 H19 V10"/></svg>
        </button>
        <img src="../pics/zerovr.png" alt="Zero Latency VR">
        <span class="text">
            <span class="kicker">Play a Game</span>
            <h1>Pepper's Game Room</h1>
            <p>Tap a game to play until your booking starts.</p>
        </span>
    </header>

    <div class="games">
        <div class="row">
            <button type="button" class="card rps" id="rpsButton" onclick="raiseConfirmationEvent('rpsSelected')">
                <span class="icon">
                    <svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="22" cy="58" r="15"/>
                        <rect x="40" y="36" width="22" height="30" rx="4"/>
                        <circle cx="73" cy="67" r="8"/>
                        <circle cx="89" cy="67" r="8"/>
                        <path d="M68 38 L93 62 M93 38 L68 62"/>
                    </svg>
                </span>
                <span class="info">
                    <div class="name">Rock Paper Scissors</div>
                    <div class="desc">Best of three, tap your move.</div>
                    <span class="tag">Vs Pepper</span>
                </span>
            </button>
            <button type="button" class="card mole" id="moleButton" onclick="raiseConfirmationEvent('moleSelected')">
                <span class="icon">
                    <svg viewBox="0 0 100 100" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="28" y1="84" x2="52" y2="52"/>
                        <rect x="46" y="18" width="40" height="24" rx="6" transform="rotate(35 66 30)"/>
                    </svg>
                </span>
                <span class="info">
                    <div class="name">Whack-a-Mole</div>
                    <div class="desc">Tap the targets before time runs out.</div>
                    <span class="tag">30 sec</span>
                </span>
            </button>
        </div>
        <div class="row">
            <button type="button" class="card memory" id="memoryButton" onclick="raiseConfirmationEvent('memorySelected')">
                <span class="icon">
                    <svg viewBox="0 0 100 100" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="16" y="20" width="40" height="54" rx="6" transform="rotate(-8 36 47)"/>
                        <rect x="42" y="22" width="40" height="54" rx="6" transform="rotate(8 62 49)"/>
                        <path d="M56 42 l4 8 8 1 -6 6 1.5 8 -7.5 -4 -7.5 4 1.5 -8 -6 -6 8 -1 z" transform="rotate(8 62 49)" fill="currentColor" stroke="none"/>
                    </svg>
                </span>
                <span class="info">
                    <div class="name">Memory Match</div>
                    <div class="desc">Flip cards, find every pair.</div>
                    <span class="tag">Brain</span>
                </span>
            </button>
            <button type="button" class="card ttt" id="tttButton" onclick="raiseConfirmationEvent('tttSelected')">
                <span class="icon">
                    <svg viewBox="0 0 100 100" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M38 14 V86 M62 14 V86 M14 38 H86 M14 62 H86"/>
                        <path d="M19 19 L31 31 M31 19 L19 31"/>
                        <circle cx="50" cy="50" r="6.5"/>
                        <path d="M69 69 L81 81 M81 69 L69 81"/>
                    </svg>
                </span>
                <span class="info">
                    <div class="name">Tic-Tac-Toe</div>
                    <div class="desc">Vs a friend, or vs Pepper on 3 levels.</div>
                    <span class="tag">Strategy</span>
                </span>
            </button>
        </div>
    </div>

    <footer>You can come back here any time — just tap the menu icon in a game.</footer>
</body>
</html>
