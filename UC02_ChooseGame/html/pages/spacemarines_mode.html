<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interact with Pepper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>

    <!-- Written for Pepper's older tablet browser: flexbox only (no CSS grid, no CSS variables, no "gap"),
         no backdrop-filter - blur is baked onto the background image layer instead. Same visual language
         as confirmation.html (full-bleed blurred art, chamfered corners, glow accents). -->
    <style>
        * { -webkit-box-sizing: border-box; box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            background: #0a0b12;
            color: #f4f1ff;
            font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none; user-select: none;
            position: relative;
        }

        .backdrop {
            position: absolute;
            top: -4%; left: -4%; right: -4%; bottom: -4%;
            background-image: url('../pics/spacemarines.png');
            background-position: center;
            background-size: cover;
            -webkit-filter: blur(14px) brightness(0.4) saturate(1.2);
            filter: blur(14px) brightness(0.4) saturate(1.2);
        }
        .backdrop-shade {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(10,11,18,0.9) 0%, rgba(10,11,18,0.75) 100%);
        }

        .stage {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3vh 4vw;
        }

        .kicker {
            display: inline-block;
            font-size: 1.1vw;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #6ee7ff;
            padding-bottom: 0.5vh;
            border-bottom: 2px solid rgba(110, 231, 255, 0.5);
            margin-bottom: 2vh;
        }

        h1 {
            font-size: 3vw;
            font-weight: 800;
            margin: 0 0 1vh 0;
            text-align: center;
            text-shadow: 0 0.3vw 1.5vw rgba(0,0,0,0.5);
        }
        .subtitle {
            font-size: 1.4vw;
            color: #c3c7de;
            margin: 0 0 4vh 0;
            text-align: center;
        }

        .modes { display: flex; flex-direction: row; }

        .mode {
            -webkit-appearance: none;
            border: 0;
            cursor: pointer;
            font: inherit;
            color: #f4f1ff;
            width: 22vw;
            margin: 0 1.2vw;
            padding: 2.5vh 1.8vw;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.18);
            -webkit-clip-path: polygon(1.4vw 0, 100% 0, 100% calc(100% - 1.4vw), calc(100% - 1.4vw) 100%, 0 100%, 0 1.4vw);
            clip-path: polygon(1.4vw 0, 100% 0, 100% calc(100% - 1.4vw), calc(100% - 1.4vw) 100%, 0 100%, 0 1.4vw);
            text-align: left;
            -webkit-transition: -webkit-transform .12s ease;
            transition: transform .12s ease;
            position: relative;
        }
        .mode:active { -webkit-transform: scale(0.96); transform: scale(0.96); }

        .mode .big { font-size: 3vw; font-weight: 800; line-height: 1; }
        .mode .big span { font-size: 1.3vw; font-weight: 700; opacity: .7; margin-left: 0.4vw; }
        .mode .tag {
            display: inline-block;
            font-size: 1vw;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 1.2vh 0 1.6vh 0;
            padding: 0.4vh 0.9vw;
            border-radius: 2vw;
        }
        .mode .feat {
            font-size: 1.15vw;
            color: #c3c7de;
            line-height: 1.6;
        }

        #standardButton .tag { background: rgba(110,231,255,0.18); color: #6ee7ff; }
        #standardButton { box-shadow: 0 0 0 rgba(110,231,255,0); }

        #hardcoreButton {
            background: linear-gradient(160deg, rgba(255,90,90,0.16), rgba(255,90,90,0.04));
            border-color: rgba(255,120,120,0.5);
        }
        #hardcoreButton .tag { background: rgba(255,120,120,0.22); color: #ff9a9a; }
    </style>
</head>

<body>
    <div class="backdrop"></div>
    <div class="backdrop-shade"></div>

    <div class="stage">
        <span class="kicker">Space Marines V R</span>
        <h1>Choose Your Mission Length</h1>
        <p class="subtitle">Tap a mode, or tell Pepper which one you want.</p>

        <div class="modes">
            <button type="button" id="standardButton" class="mode" onclick="raiseConfirmationEvent('spacemarines30Selected')">
                <div class="big">30<span>MIN</span></div>
                <div class="tag">Standard</div>
                <div class="feat">Classic skirmish mode.</div>
            </button>
            <button type="button" id="hardcoreButton" class="mode" onclick="raiseConfirmationEvent('spacemarines45Selected')">
                <div class="big">45<span>MIN</span></div>
                <div class="tag">Hardcore</div>
                <div class="feat">+ Friendly fire<br>+ Revive teammates</div>
            </button>
        </div>
    </div>
</body>
</html>
