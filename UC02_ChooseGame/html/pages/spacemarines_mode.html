<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interact with Pepper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>

    <!-- Written for Pepper's older tablet browser: flexbox only (no CSS grid, no CSS variables, no "gap"),
         no backdrop-filter - blur is baked onto the background image layer instead. Same visual language
         as confirmation.html (full-bleed blurred art, chamfered corners, glow accents). -->
    <link rel="stylesheet" type="text/css" href="../css/spacemarines_mode.css">
</head>

<body>
    <div class="backdrop"></div>
    <div class="backdrop-shade"></div>

    <div class="stage">
        <span class="kicker">Space Marines V R</span>
        <h1>Choose Your Mission Length</h1>
        <p class="subtitle">Tap a mode, or tell Pepper which one you want.</p>

        <div class="modes">
            <button type="button" id="standardButton" class="mode" onclick="raiseConfirmationEvent('spacemarines30Selected')">
                <div class="big">30<span>MIN</span></div>
                <div class="tag">Standard</div>
                <div class="feat">Classic skirmish mode.</div>
            </button>
            <button type="button" id="hardcoreButton" class="mode" onclick="raiseConfirmationEvent('spacemarines45Selected')">
                <div class="big">45<span>MIN</span></div>
                <div class="tag">Hardcore</div>
                <div class="feat">+ Friendly fire<br>+ Revive teammates</div>
            </button>
        </div>
    </div>
</body>
</html>
