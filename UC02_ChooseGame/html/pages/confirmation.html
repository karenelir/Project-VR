<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interact with Pepper</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/libs/qi/2/qi.js"></script>
    <script src="../js/jquery.js"></script>
    <script src="../js/qievents.js"></script>
    <script src="../js/displayinfo.js"></script>

    <!-- Written for Pepper's older tablet browser: flexbox only (no CSS grid, no CSS variables, no "gap"),
         no backdrop-filter (unsupported there) - the blur is baked onto the background image layer instead. -->
    <link rel="stylesheet" type="text/css" href="../css/confirmation.css">
</head>

<body>
    <div class="backdrop" id="backdropImg"></div>
    <div class="backdrop-shade"></div>

    <div class="stage">
        <div class="thumb" id="thumbImg">
            <div class="thumb-glow"></div>
        </div>
        <!-- kept for compatibility with displayPageInformation(), never shown -->
        <img id="pageImage" src="../pics/pepper-standing.png" alt="" style="display:none;">

        <div class="panel">
            <span class="kicker">Confirm</span>
            <h1 id="pageHeading"></h1>
            <p id="pageText"></p>
            <div class="buttons">
                <button type="button" id="noButton" onclick="raiseConfirmationEvent('noAnswer')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M5 5 L19 19 M19 5 L5 19"/></svg>
                    No
                </button>
                <button type="button" id="yesButton" onclick="raiseConfirmationEvent('yesAnswer')">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 L10 18 L20 6"/></svg>
                    Yes
                </button>
            </div>
        </div>
    </div>
</body>
<script src="../js/confirmation.js"></script>
</html>
